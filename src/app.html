<title>Learner Lens</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: an app bar with three views (Teacher, Student, Toolkit); content in a centered 1120px column, panels stack at phone width. */
:root{
  --bg:#F3F5F9; --surface:#FFFFFF; --sunk:#EBEEF4; --ink:#172033; --muted:#5A6377; --line:#DCE1EA;
  --accent:#2C59CC; --accent-ink:#FFFFFF; --accent-soft:#E5EBFA;
  --good:#1D7F55; --good-soft:#E2F3EA; --warn:#9A6514; --warn-soft:#FBF0DC; --bad:#B8362F; --bad-soft:#FBE6E4;
  --shadow:0 1px 2px rgba(23,32,51,.06),0 8px 24px rgba(23,32,51,.06);
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E131D; --surface:#161D2A; --sunk:#111723; --ink:#E6EAF2; --muted:#9BA5B9; --line:#283247;
  --accent:#7E9EF2; --accent-ink:#0E131D; --accent-soft:#1D2944;
  --good:#5CCB97; --good-soft:#15302A; --warn:#E5B35C; --warn-soft:#33291A; --bad:#F2857C; --bad-soft:#3A1F1F;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E131D; --surface:#161D2A; --sunk:#111723; --ink:#E6EAF2; --muted:#9BA5B9; --line:#283247;
  --accent:#7E9EF2; --accent-ink:#0E131D; --accent-soft:#1D2944;
  --good:#5CCB97; --good-soft:#15302A; --warn:#E5B35C; --warn-soft:#33291A; --bad:#F2857C; --bad-soft:#3A1F1F;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-block:12px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.brand-mark{width:30px;height:30px;border-radius:8px;background:var(--accent);display:grid;place-items:center}
.brand-mark svg{width:18px;height:18px}
.brand h1{font-size:20px;font-weight:800;letter-spacing:-.01em}
.brand small{display:block;color:var(--muted);font-size:12px;font-family:var(--f-body)}
.seg{display:flex;background:var(--sunk);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:7px 14px;border-radius:8px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
main{padding-block:24px 64px}
.notice{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 16px;color:var(--muted);margin-bottom:20px}
.notice b{color:var(--ink)}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.page-head h2{font-size:28px;font-weight:800;letter-spacing:-.01em}
.page-head p{margin:4px 0 0;color:var(--muted);max-width:62ch}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:24px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.stat .n{font-family:var(--f-display);font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.stat .l{color:var(--muted);font-size:13px}
.stat.alert .n{color:var(--bad)}
.cols{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;align-items:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px}
.panel-h{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line)}
.panel-h h3{font-size:17px}
.panel-b{padding:8px 16px 16px}
.row{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) 110px 150px;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.who{min-width:0}
.who button.name{border:0;background:none;padding:0;font-weight:700;font-size:16px;text-align:left;color:var(--ink);text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.who button.name:hover{text-decoration-color:var(--accent)}
.who .sum{color:var(--muted);font-size:13px;margin-top:2px}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.chip.code{font-family:var(--f-mono);font-weight:600}
.flag{font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--bad-soft);color:var(--bad)}
.prog{min-width:0}
.prog .t{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.meter{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden;margin-top:4px}
.meter i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s}
.score{font-family:var(--f-mono);font-weight:600;font-variant-numeric:tabular-nums;font-size:14px;padding:3px 8px;border-radius:8px;display:inline-block}
.score.good{background:var(--good-soft);color:var(--good)} .score.warn{background:var(--warn-soft);color:var(--warn)} .score.bad{background:var(--bad-soft);color:var(--bad)} .score.none{background:var(--sunk);color:var(--muted)}
.score-l{font-size:12px;color:var(--muted);display:block;margin-top:2px}
select.status{width:100%;padding:7px 8px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:13px}
select.status[data-v="on-track"]{color:var(--good)} select.status[data-v="needs-help"]{color:var(--bad)} select.status[data-v="goal-met"]{color:var(--accent)}
.group{padding:12px 0;border-bottom:1px solid var(--line)}
.group:last-child{border-bottom:0}
.group-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.group h4{margin:0;font-size:15px}
.group .when{font-size:12px;color:var(--muted);font-family:var(--f-mono)}
.group .names{color:var(--muted);font-size:13px;margin:2px 0 8px}
.btn{border:1px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:9px;font-weight:700;font-size:13px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.small{padding:4px 10px;font-size:12px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent)}
.since{margin-bottom:20px}
.since-b{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;padding:12px 16px 16px}
.since h4{margin:0 0 6px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);display:flex;gap:6px;align-items:center}
.since ul{list-style:none;margin:0;padding:0}
.since li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;padding:6px 0;border-top:1px solid var(--line);font-size:14px;align-items:baseline}
.since li:first-child{border-top:0}
.since li time{color:var(--muted);font-size:12px;font-family:var(--f-mono);white-space:nowrap}
.since .cnt{background:var(--accent);color:var(--accent-ink);border-radius:99px;padding:0 7px;font-size:12px;letter-spacing:0}
.since .more{color:var(--muted);font-size:13px;padding-top:6px}
.chip.new{background:var(--accent);color:var(--accent-ink)}
.mathp{margin-bottom:20px}
.two-sel{display:grid;grid-template-columns:minmax(0,1fr);gap:4px;margin-top:12px}
.two-sel label{display:block;margin:6px 0 4px}
.mathp h4,.mathnow h4{font-family:var(--f-display);font-size:19px;font-weight:600;margin:2px 0}
.mathp .when{font-size:12px;color:var(--muted);font-family:var(--f-mono)}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.next{font-size:13px;color:var(--muted);margin-top:10px}
.next a{color:var(--accent);font-weight:700}
.mathnow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center;background:var(--surface);border:1px solid var(--accent);border-radius:14px;padding:16px}
.mathnow p{margin:4px 0 0;color:var(--muted)}
.topic{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 8px;border-top:1px solid var(--line);flex-wrap:wrap}
.topic:first-of-type{border-top:0}
.topic.cur{background:var(--accent-soft);border-radius:10px}
.topic .tn{min-width:0}
.topic .meta{font-size:12px;color:var(--muted);font-family:var(--f-mono)}
.topic .btns{margin-top:0}
.guide h2{font-size:30px;font-weight:800}
.guide .lead{margin-bottom:4px}
.guide .sec p{margin:0 0 8px}
.vocab{display:grid;grid-template-columns:150px minmax(0,1fr);gap:6px 14px;margin:0}
.vocab dt{font-weight:700}.vocab dd{margin:0}
pre.ex{margin:0;background:var(--sunk);border-radius:9px;padding:10px 12px;font-family:var(--f-mono);font-size:14px;white-space:pre-wrap;line-height:1.6}
.sec.warn{border-color:var(--warn)}
.mist{margin:0;padding-left:20px}.mist li{margin-bottom:4px}
.empty{padding:28px 8px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
/* drawer */
.scrim{position:fixed;inset:0;background:rgba(10,14,22,.45);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--bg);z-index:21;overflow-y:auto;box-shadow:var(--shadow);padding:calc(env(safe-area-inset-top,0px) + 16px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 32px) 20px}
.drawer-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:12px}
.drawer-h h2{font-size:24px;font-weight:800}
.x{border:0;background:var(--sunk);width:34px;height:34px;border-radius:9px;font-size:18px;line-height:1;flex:none}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-top:12px}
.sec h3{font-size:15px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.subj{background:var(--sunk);border-radius:10px;padding:8px;text-align:center}
.subj small{display:block;color:var(--muted);font-size:11px}
.kv{display:grid;grid-template-columns:110px minmax(0,1fr);gap:4px 12px;font-size:14px;margin-top:10px}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.task{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line)}
.task:first-of-type{border-top:0}
.task input{width:18px;height:18px;margin-top:2px;accent-color:var(--accent);flex:none}
.task label{flex:1;min-width:0}
.task .meta{font-size:12px;color:var(--muted);font-family:var(--f-mono)}
.task.done label .tt{text-decoration:line-through;color:var(--muted)}
.overdue{color:var(--bad);font-weight:700}
.add{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.add select,.add input{flex:1;min-width:0;padding:7px 8px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:13px}
textarea{width:100%;min-height:90px;border:1px solid var(--line);border-radius:9px;padding:10px;background:var(--surface);resize:vertical}
.att{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.att:first-of-type{border-top:0}
.att .miss{color:var(--muted);font-size:12px}
/* student view */
.hello{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:20px}
.hello h2{font-size:30px;font-weight:800}
.hello p{margin:4px 0 0;color:var(--muted)}
.ring{width:96px;height:96px;position:relative}
.ring svg{width:96px;height:96px;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-display);font-size:22px;font-variant-numeric:tabular-nums}
.as{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.as select{padding:7px 10px;border-radius:9px;border:1px solid var(--line);background:var(--surface);font-weight:700}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:8px}
.card h4{margin:0;font-size:16px;font-family:var(--f-display);font-weight:600}
.card .meta{font-size:12px;color:var(--muted);font-family:var(--f-mono)}
.card .go{margin-top:auto}
.card.next{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
h3.sub{font-size:18px;margin:24px 0 10px}
.res{display:flex;flex-wrap:wrap;gap:8px}
.res a{color:var(--accent);font-weight:700;text-decoration:none;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:7px 12px;font-size:13px}
.res a:hover{border-color:var(--accent)}
/* library */
.lib{display:grid;grid-template-columns:240px minmax(0,1fr);gap:20px;align-items:start}
.lib-nav{display:flex;flex-direction:column;gap:6px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 80px)}
.lib-nav button{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;display:flex;gap:10px;align-items:center}
.lib-nav button[aria-current="true"]{border-color:var(--accent);background:var(--accent-soft)}
.lib-nav .code{font-family:var(--f-mono);font-weight:600;color:var(--accent);width:18px}
.lib-nav .nm{font-weight:700;font-size:14px}
.lib-body h2{font-size:26px;font-weight:800}
.lead{color:var(--muted);margin:6px 0 0;max-width:65ch}
.script{list-style:none;margin:0;padding:0}
.script li{display:grid;grid-template-columns:82px minmax(0,1fr);gap:12px;padding:8px 0;border-top:1px solid var(--line)}
.script li:first-child{border-top:0}
.script .tm{font-family:var(--f-mono);font-size:13px;color:var(--accent);font-weight:600}
details{border-top:1px solid var(--line);padding-top:8px;margin-top:8px}
summary{cursor:pointer;font-weight:700;color:var(--accent)}
.key{margin:8px 0 0;padding-left:20px}
.key li{margin-bottom:10px}
.key .ok{color:var(--good);font-weight:700}
.key .mis{color:var(--muted);font-size:13px;display:block}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
/* quiz */
.quiz{position:fixed;inset:0;z-index:30;background:var(--bg);overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 16px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 32px) max(16px,env(safe-area-inset-left,0px))}
.quiz-in{max-width:680px;margin:0 auto}
.quiz-top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}
.quiz-top .t{font-weight:700}
.quiz-top .p{font-family:var(--f-mono);color:var(--muted);font-size:13px}
.steps{display:flex;gap:4px;margin-bottom:20px}
.steps i{flex:1;height:5px;border-radius:9px;background:var(--line)}
.steps i.ok{background:var(--good)} .steps i.no{background:var(--bad)} .steps i.cur{background:var(--accent)}
.passage{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:16px;font-size:15px}
.passage cite{display:block;color:var(--muted);font-size:12px;font-style:normal;margin-top:6px}
.qtext{font-family:var(--f-display);font-size:24px;font-weight:600;margin-bottom:16px;line-height:1.25}
.opts{display:grid;gap:8px}
.opt{text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:14px 16px;font-size:17px}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt.ok{border-color:var(--good);background:var(--good-soft)}
.opt.no{border-color:var(--bad);background:var(--bad-soft)}
.opt[disabled]{cursor:default}
.fb{margin-top:14px;border-radius:12px;padding:12px 14px}
.fb.ok{background:var(--good-soft);color:var(--good)} .fb.no{background:var(--bad-soft);color:var(--bad)}
.fb b{display:block}
.fb span{color:var(--ink)}
.quiz-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.result{text-align:center;padding:24px 0}
.result .big{font-family:var(--f-display);font-size:64px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:700;z-index:40;max-width:calc(100% - 32px)}
@media (max-width:900px){
  .cols,.lib{grid-template-columns:minmax(0,1fr)}
  .lib-nav{position:static;flex-direction:row;overflow-x:auto}
  .lib-nav button{flex:none}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:640px){
  .row{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .row .who{grid-column:1/-1}
  .two,.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .since-b{grid-template-columns:minmax(0,1fr)}
  .mathnow{grid-template-columns:minmax(0,1fr)}
  .vocab{grid-template-columns:minmax(0,1fr)}
  .hello{grid-template-columns:minmax(0,1fr)}
  .page-head h2{font-size:24px}
  .qtext{font-size:20px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<header class="bar">
  <div class="wrap">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="var(--accent-ink)" stroke-width="2.4" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l5 5"/><path d="M8 11.5l2 2 3.5-4"/></svg></div>
      <div><h1>Learner Lens</h1><small>Mock 8th grade class · 10 fictional students</small></div>
    </div>
    <nav class="seg" aria-label="View">
      <button id="v-teacher" data-view="teacher" aria-pressed="true">Teacher</button>
      <button id="v-student" data-view="student" aria-pressed="false">Student</button>
      <button id="v-library" data-view="library" aria-pressed="false">Toolkit</button>
    </nav>
  </div>
</header>

<main class="wrap">
  <div id="dbnote" class="notice" hidden></div>
  <section id="teacher"></section>
  <section id="student" hidden></section>
  <section id="library" hidden></section>
</main>
<div id="overlay"></div>
<div id="toast" class="toast" role="status" hidden></div>

<script>
/* ---------------- Toolkit library: lessons, checks, answer keys ---------------- */
const SUBJECTS = ["Algebra I","Science","English 8","U.S. History"];
const SKILLS = {

 {n:6,name:"Exponential functions",mp:"MP3",topics:[

   ideas:[["Apply the rules to variables","",["(2x³)² = 4x⁶","x⁵ · x⁻² = x³","12a⁶ ÷ 4a² = 3a⁴"]],

   mistakes:["Forgetting to raise the coefficient: (3x²)³ = 27x⁶.","Reading 16^(3/4) as ¾ of 16."],

       {q:"x⁵ · x⁻² = ?",o:[opt("x³",1,"5 + (−2) = 3."),opt("x⁻¹⁰",0,"Multiplying adds exponents."),opt("x⁷",0,"5 + (−2) = 3, not 7.")]},
       {q:"12a⁶ ÷ 4a² = ?",o:[opt("3a⁴",1,"12 ÷ 4 = 3, 6 − 2 = 4."),opt("8a⁴",0,"Divide 12 by 4."),opt("3a³",0,"Subtract exponents: 6 − 2 = 4.")]},

       {q:"16^(3/4) = ?",o:[opt("8",1,"⁴√16 = 2, and 2³ = 8."),opt("12",0,"It's not ¾ of 16. Take the 4th root, then cube."),opt("64",0,"That's 16^(3/2).")]}]},
  {id:"6b",name:"Exponential growth & decay",from:"2027-02-11",to:"2027-02-26",std:"F-LE.A.1c, F-LE.A.2, F-IF.C.8b, F-BF.A.1a",

 {n:7,name:"Polynomials & factoring",mp:"MP3",topics:[

    <div class="sec"><div class="grid4">${SUBJECTS.map(s=>{const v=st.baseline&&st.baseline[s];return `<div class="subj"><span class="score ${tone(v)}">${v!=null?v+"%":"—"}</span><small>${esc(s)}</small></div>`}).join("")}</div>
      <dl class="kv"><dt>Why</dt><dd>${esc(st.summary)}</dd><dt>Week 6 target</dt><dd>${esc(st.target)}</dd>${st.helper?`<dt>Peer helper</dt><dd>${esc(st.helper)}</dd>`:""}</dl></div>
    <div class="sec"><h3>Teacher actions</h3>${tt.map(taskRow).join("")||'<div class="empty">None</div>'}</div>
    <div class="sec"><h3>Student tasks <span class="eyebrow">${sts.filter(t=>t.done).length}/${sts.length} done</span></h3>${sts.map(taskRow).join("")||'<div class="empty">None</div>'}
      <div class="add"><select id="addsel" aria-label="Task to add"><option value="">Add a task from the toolkit…</option>${addOpts}</select><select id="addwk" aria-label="Week">${[1,2,3,4,5,6].map(n=>`<option value="${n}"${n===w?" selected":""}>Week ${n}</option>`).join("")}</select><button class="btn primary" data-add="${esc(st.id)}">Add</button></div></div>
    <div class="sec"><h3>Check results</h3>${atts.map(a=>`<div class="att"><div><b>${esc(QUIZZES[a.quiz]?QUIZZES[a.quiz].title:a.quiz)}</b><div class="miss">${fmtDate(a.at)}${a.missed&&a.missed.length?" · missed: "+a.missed.map(i=>esc((QUIZZES[a.quiz]&&QUIZZES[a.quiz].qs[i]?QUIZZES[a.quiz].qs[i].q:"")).slice(0,48)).join(" | "):" · no mistakes"}</div></div><span class="score ${tone(a.pct)}">${a.pct}%</span></div>`).join("")||'<div class="empty">No checks taken yet. Results appear here the moment the student finishes one.</div>'}</div>
    <div class="sec"><h3><label for="notes">Teacher notes</label></h3><textarea id="notes" data-notes="${esc(st.id)}" placeholder="What you noticed this week">${esc(st.notes||"")}</textarea></div>
    <div class="sec"><h3>Parent update <button class="btn small" data-copy="pm">Copy</button></h3><textarea id="pm" readonly>${esc(parentMsg(st))}</textarea></div>
  </aside>`;
}

/* ---------------- student view ---------------- */
function renderStudent(){
  const el=$("#student");
  if(!S.students.length){el.innerHTML=`<div class="page-head"><div><h2>My plan</h2><p>Each student sees their own tasks here, with practice that checks answers instantly.</p></div></div><div class="panel">${emptyStudents()}</div>`+libPicks(["A","B","C","D"]);return}
  const st=S.students.find(s=>s.id===S.as)||S.students[0];S.as=st.id;
  const ts=tasksFor(st.id).filter(t=>t.kind!=="teacher");const d=ts.filter(t=>t.done).length;const open=ts.filter(t=>!t.done);const w=curWeek();
  const p=pct(d,ts.length),C=2*Math.PI*42;
  const card=(t,i)=>{const q=QUIZZES[t.ref];return `<div class="card${i===0?" next":""}"><div class="eyebrow">${i===0?"Next up":"Week "+(t.week||1)}${(t.week||1)<w?' · <span class="overdue">overdue</span>':""}</div><h4>${esc(t.title)}</h4><div class="meta">${t.minutes||5} min · ${esc(SKILLS[t.skill]?SKILLS[t.skill].short:"")}${q?" · "+q.qs.length+" questions":""}</div>
    <div class="go">${q?`<button class="btn primary" data-start="${esc(t.ref)}" data-taskid="${esc(t.id)}">Start</button>`:`<button class="btn" data-done="${esc(t.id)}">Mark done</button>`}</div></div>`};
  el.innerHTML=`<div class="as" style="margin-bottom:12px"><label class="eyebrow" for="as">Viewing as</label><select id="as">${S.students.map(s=>`<option value="${esc(s.id)}"${s.id===st.id?" selected":""}>${esc(s.name)}</option>`).join("")}</select><span style="color:var(--muted);font-size:13px">In a pilot, each student signs in and sees only their own plan.</span></div>
  <div class="hello"><div><div class="eyebrow">Week ${w} of 6</div><h2>Hi ${esc(first(st.name))}</h2><p>${open.length?`${open.length} task${open.length>1?"s":""} to go. Start with the first card, it takes about ${open[0].minutes||5} minutes.`:"All tasks done. Nice work."}${st.helper?` Your study partner is ${esc(st.helper)}.`:""}</p></div>
  <div class="ring" role="img" aria-label="${p}% of tasks done"><svg viewBox="0 0 96 96"><circle cx="48" cy="48" r="42" fill="none" stroke="var(--sunk)" stroke-width="10"/><circle cx="48" cy="48" r="42" fill="none" stroke="var(--accent)" stroke-width="10" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-p/100)}"/></svg><b>${d}/${ts.length}</b></div></div>
  <div class="cards">${open.map(card).join("")||'<div class="empty"><b>Nothing left to do</b>Your teacher will add the next step.</div>'}</div>
  ${mathCard()}
  ${ts.filter(t=>t.done).length?`<h3 class="sub">Done</h3><div class="cards">${ts.filter(t=>t.done).map(t=>`<div class="card"><div class="eyebrow">Done ${t.doneAt?fmtDate(t.doneAt):""}</div><h4>${esc(t.title)}</h4>${QUIZZES[t.ref]?`<div class="go"><button class="btn" data-start="${esc(t.ref)}">Practice again</button></div>`:""}</div>`).join("")}</div>`:""}
  ${libPicks(st.focus||[])}`;
}
function libPicks(focus){const links=focus.flatMap(k=>SKILLS[k]?SKILLS[k].res:[]);const prac=focus.filter(k=>SKILLS[k]&&SKILLS[k].practice);
  return `<h3 class="sub">Practice anytime</h3><div class="res">${prac.map(k=>`<a href="#" data-start="${SKILLS[k].practice}">${esc(QUIZZES[SKILLS[k].practice].title)}</a>`).join("")}${links.map(([n,u])=>`<a href="${u}" target="_blank" rel="noopener">${esc(n)} ↗</a>`).join("")}</div>`}

/* ---------------- library view ---------------- */
function keyList(id){const qz=QUIZZES[id];return `<ol class="key">${qz.qs.map(q=>{const ok=q.o.find(o=>o.ok);return `<li>${esc(q.q)}<span class="ok">${esc(ok.t)}</span>${q.o.filter(o=>!o.ok).map(o=>`<span class="mis">If “${esc(o.t)}”: ${esc(o.why)}</span>`).join("")}</li>`}).join("")}</ol>`}
function renderLibrary(){
  const k=S.libSkill,sk=SKILLS[k]||SKILLS.A;const who=S.students.filter(s=>(s.focus||[]).includes(k));
  const quizBlock=(id,label)=>!id?"":`<div class="sec"><h3>${label} <button class="btn small" data-start="${id}" data-preview-mode="1">Try it</button></h3><div style="color:var(--muted);font-size:14px">${esc(QUIZZES[id].title)} · ${QUIZZES[id].qs.length} questions · auto-graded</div><details><summary>Answer key & common mistakes</summary>${keyList(id)}</details></div>`;
  $("#library").innerHTML=`<div class="page-head"><div><h2>Toolkit</h2><p>Everything a teacher needs for each weak skill: a timed lesson script, an auto-graded check, practice with feedback on every wrong answer, and links for home.</p></div></div>
  <div class="lib"><nav class="lib-nav" aria-label="Skills"><button data-skill="M" aria-current="${k==="M"}"><span class="code">M</span><span class="nm">Math year plan</span></button>${Object.entries(SKILLS).map(([c,s])=>`<button data-skill="${c}" aria-current="${c===k}"><span class="code">${c}</span><span class="nm">${esc(s.name)}</span></button>`).join("")}</nav>
  <div class="lib-body">${k==="M"?mathPlanBody():`<div class="eyebrow">${esc(sk.subject)} · ${esc(sk.time)}</div><h2>${esc(sk.name)}</h2><p class="lead">${esc(sk.signal)}${who.length?` For: ${who.map(s=>esc(s.name)).join(", ")}.`:""}</p>
  <div class="sec"><h3>Lesson script</h3><ol class="script">${sk.lesson.map(([t,x])=>`<li><span class="tm">${esc(t)}</span><span>${esc(x)}</span></li>`).join("")}</ol>${sk.lesson2?`<details><summary>Part 2: ratios & decimals</summary><ol class="script">${sk.lesson2.map(([t,x])=>`<li><span class="tm">${esc(t)}</span><span>${esc(x)}</span></li>`).join("")}</ol></details>`:""}</div>
  <div class="two">${quizBlock(sk.check,"5-minute check")}${quizBlock(sk.practice,"Practice set")}</div>${quizBlock(sk.extra,"Part 2 check")}
  <div class="sec"><h3>At home</h3><div>${esc(sk.home)}</div>${sk.res.length?`<div class="res" style="margin-top:10px">${sk.res.map(([n,u])=>`<a href="${u}" target="_blank" rel="noopener">${esc(n)} ↗</a>`).join("")}</div>`:""}</div>
  <div class="sec"><h3>Done when</h3><div>${esc(sk.done)}</div></div>`}</div></div>`;
}

/* ---------------- quiz runner ---------------- */
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function startQuiz(id,taskId,preview){const qz=QUIZZES[id];if(!qz)return;S.quiz={id,taskId:taskId||null,preview:!!preview||S.view==="library"||S.view==="teacher",i:0,picked:null,results:[],order:qz.qs.map(q=>shuffle(q.o))};renderQuiz()}
function renderQuiz(){
  const ov=$("#overlay");const z=S.quiz;if(!z){renderDrawer();return}
  const qz=QUIZZES[z.id];const st=S.students.find(s=>s.id===S.as);
  const steps=qz.qs.map((_,i)=>`<i class="${i<z.results.length?(z.results[i]?"ok":"no"):i===z.i?"cur":""}"></i>`).join("");
  let body;
  if(z.i>=qz.qs.length){const sc=z.results.filter(Boolean).length,p=pct(sc,qz.qs.length);const missed=z.results.map((r,i)=>r?null:i).filter(i=>i!==null);
    body=`<div class="result"><div class="eyebrow">${esc(qz.title)}</div><div class="big">${p}%</div><p>${sc} of ${qz.qs.length} correct.${p>=80?" Goal met for this check.":p>=70?" Close. One more practice round should do it.":" Your teacher will go over these with you."}</p></div>
    ${missed.length?`<div class="sec"><h3>Review</h3>${missed.map(i=>{const q=qz.qs[i];return `<div class="att"><div><b>${esc(q.q)}</b><div class="miss">Answer: ${esc(q.o.find(o=>o.ok).t)} — ${esc(q.o.find(o=>o.ok).why)}</div></div></div>`}).join("")}</div>`:""}
    <div class="quiz-foot">${z.preview?'<span style="color:var(--muted);margin-right:auto;align-self:center">Preview: not saved</span>':`<span style="color:var(--muted);margin-right:auto;align-self:center">${z.saved?"Saved. Your teacher can see this.":"Saving…"}</span>`}<button class="btn primary" data-qclose>Done</button></div>`;
    if(!z.preview&&!z.saving&&!z.saved&&st)saveAttempt(st,qz,sc,p,missed);
  } else {
    const q=qz.qs[z.i],opts=z.order[z.i];const ans=z.picked!=null;
    body=`${qz.passage?`<div class="passage">${esc(qz.passage)}${qz.cite?`<cite>${esc(qz.cite)}</cite>`:""}</div>`:""}
    <div class="qtext">${esc(q.q)}</div><div class="opts">${opts.map((o,j)=>`<button class="opt${ans&&o.ok?" ok":""}${ans&&z.picked===j&&!o.ok?" no":""}" data-pick="${j}"${ans?" disabled":""}>${esc(o.t)}</button>`).join("")}</div>
    ${ans?(()=>{const p=opts[z.picked];const ok=opts.find(o=>o.ok);return p.ok?`<div class="fb ok"><b>Correct</b><span>${esc(p.why)}</span></div>`:`<div class="fb no"><b>Not quite</b><span>${esc(p.why)} The answer is ${esc(ok.t)}.</span></div>`})():""}
    <div class="quiz-foot">${ans?`<button class="btn primary" data-next>${z.i===qz.qs.length-1?"See score":"Next"}</button>`:""}</div>`;
  }
  ov.innerHTML=`<div class="quiz" role="dialog" aria-modal="true" aria-label="${esc(qz.title)}"><div class="quiz-in"><div class="quiz-top"><div><div class="t">${esc(qz.title)}</div><div class="p">${z.preview?"Preview":esc(st?st.name:"")} · question ${Math.min(z.i+1,qz.qs.length)} of ${qz.qs.length}</div></div><button class="x" data-qclose aria-label="Close">×</button></div><div class="steps">${steps}</div>${body}</div></div>`;
}
async function saveAttempt(st,qz,sc,p,missed){
  const z=S.quiz;z.saving=true;
  const ok=await write(async db=>{
    await db.collection("attempts").add({student:st.id,quiz:z.id,skill:qz.skill,score:sc,total:qz.qs.length,pct:p,missed,at:new Date().toISOString()});
    let tid=z.taskId;if(!tid){const t=tasksFor(st.id).find(t=>!t.done&&t.ref===z.id);tid=t&&t.id}
    if(tid)await db.doc("tasks/"+tid).update({done:true,doneAt:new Date().toISOString()});
    await act(db,"student",st.id,"check",`Took ${qz.title}: ${p}%`);
  });
  if(S.quiz===z){z.saving=false;z.saved=ok;z.preview=!ok;renderQuiz()}
}

/* ---------------- render + events ---------------- */
function render(){
  ["teacher","student","library"].forEach(v=>{$("#"+v).hidden=S.view!==v;$("#v-"+v).setAttribute("aria-pressed",S.view===v)});
  if(S.view==="teacher")renderTeacher();else if(S.view==="student")renderStudent();else renderLibrary();
  if(S.quiz||S.guide)return; // keep the quiz or guide on screen while data updates arrive
  const notesEl=document.getElementById("notes");const focused=notesEl&&document.activeElement===notesEl;
  if(!focused)renderDrawer();
}
function setView(v){S.view=v;try{history.replaceState(null,"","#"+v)}catch(e){}try{localStorage.setItem("ll-view",v)}catch(e){}window.scrollTo(0,0);render()}
document.addEventListener("click",async e=>{
  const t=e.target.closest("[data-view],[data-open],[data-close],[data-lib],[data-skill],[data-start],[data-pick],[data-next],[data-qclose],[data-done],[data-add],[data-copy],[data-preview],[data-guide],[data-gclose],[data-assign],[data-libcourse]");if(!t)return;
  const d=t.dataset;
  if(d.view){setView(d.view)}
  else if(d.open){S.open=d.open;renderDrawer()}
  else if("close" in d){S.open=null;renderDrawer()}
  else if(d.lib){S.open=null;renderDrawer();S.libSkill=d.lib;setView("library")}
  else if(d.skill){S.libSkill=d.skill;renderLibrary()}
  else if(d.preview){startQuiz(d.preview,null,true)}
  else if(d.libcourse){S.libCourse=d.libcourse;renderLibrary()}
  else if(d.guide){e.preventDefault();S.guide=d.guide;renderGuide()}
  else if("gclose" in d){S.guide=null;$("#overlay").innerHTML="";render()}
  else if(d.assign){const tp=ALLTOPICS.find(x=>x.key===d.assign),ref=tp.key,wk=curWeek();const todo=S.students.filter(st=>!S.tasks.some(x=>x.student===st.id&&x.ref===ref));
    if(!todo.length){toast("Everyone already has this practice");return}
    await write(async db=>{for(const st of todo)await db.collection("tasks").add({student:st.id,skill:"A",kind:"student",type:"quiz",ref,title:tp.name+" practice",minutes:10,week:wk,done:false,doneAt:null});await act(db,"teacher","class","assign",`Assigned “${tp.name} practice” to ${todo.length} students`)},"Practice assigned to "+todo.length+" students")}
  else if(d.start){e.preventDefault();S.guide=null;startQuiz(d.start,d.taskid,!!d.previewMode)}
  else if(d.pick!=null&&S.quiz){if(S.quiz.picked!=null)return;S.quiz.picked=+d.pick;S.quiz.results.push(!!S.quiz.order[S.quiz.i][+d.pick].ok);renderQuiz()}
  else if("next" in d&&S.quiz){S.quiz.i++;S.quiz.picked=null;renderQuiz()}
  else if("qclose" in d){S.quiz=null;$("#overlay").innerHTML="";render()}
  else if(d.done){const tk=S.tasks.find(x=>x.id===d.done);await write(async db=>{await db.doc("tasks/"+d.done).update({done:true,doneAt:new Date().toISOString()});if(tk)await act(db,"student",tk.student,"task",`Finished “${tk.title}”`)},"Marked done")}
  else if(d.add){const v=$("#addsel").value,wk=+$("#addwk").value;if(!v){toast("Pick a task first");return}const [kind,k,ref]=v.split(":");const sk=SKILLS[k];
    const doc=kind==="q"?{student:d.add,skill:k,kind:"student",type:"quiz",ref,title:QUIZZES[ref].title,minutes:QUIZZES[ref].qs.length>5?10:5,week:wk,done:false,doneAt:null}:{student:d.add,skill:k,kind:"student",type:"todo",ref:"",title:sk.todos[+ref],minutes:15,week:wk,done:false,doneAt:null};
    await write(async db=>{await db.collection("tasks").add(doc);await act(db,"teacher",d.add,"add",`Added “${doc.title}” for week ${wk}`)},"Task added")}
  else if(d.copy){const ta=document.getElementById(d.copy);try{await navigator.clipboard.writeText(ta.value);toast("Copied")}catch(err){ta.focus();ta.select();toast("Selected. Copy with your keyboard.")}if(S.open&&S.db)act(S.db,"teacher",S.open,"parent","Copied the parent update")}
});
document.addEventListener("change",async e=>{
  const t=e.target;
  if(t.dataset.task){const id=t.dataset.task,tk=S.tasks.find(x=>x.id===id);await write(async db=>{await db.doc("tasks/"+id).update({done:t.checked,doneAt:t.checked?new Date().toISOString():null});if(tk)await act(db,"teacher",tk.student,"tick",`${t.checked?"Ticked":"Unticked"} “${tk.title}”`)})}
  else if(t.dataset.status){t.dataset.v=t.value;const sid=t.dataset.status,lbl=(STATUS.find(s=>s[0]===t.value)||[,""])[1];await write(async db=>{await db.doc("students/"+sid).update({status:t.value});await act(db,"teacher",sid,"status",`Set status to ${lbl}`)},"Status saved")}
  else if(t.id==="as"){S.as=t.value;renderStudent()}
  else if(t.id==="coursesel"){const v=t.value;await write(async db=>{await db.doc("program/settings").update({course:v,topic:null});await act(db,"teacher","class","course",`Switched math course to ${COURSES[v].label}`)},"Course saved")}
  else if(t.id==="topicsel"){const v=t.value,tp=ALLTOPICS.find(x=>x.key===v);await write(async db=>{await db.doc("program/settings").update({topic:v||null});await act(db,"teacher","class","topic",tp?`Set math topic to ${tp.name}`:"Set math topic to follow district pacing")},"Math topic saved")}
});
document.addEventListener("focusout",async e=>{const t=e.target;if(t.dataset&&t.dataset.notes){const st=S.students.find(s=>s.id===t.dataset.notes);if(st&&(st.notes||"")!==t.value)await write(async db=>{await db.doc("students/"+st.id).update({notes:t.value});await act(db,"teacher",st.id,"notes","Updated notes: “"+t.value.slice(0,60)+(t.value.length>60?"…":"")+"”")},"Notes saved")}});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){if(S.guide&&!S.quiz){S.guide=null;$("#overlay").innerHTML="";render()}else if(S.quiz){S.quiz=null;$("#overlay").innerHTML="";render()}else if(S.open){S.open=null;renderDrawer()}}});
(function boot(){let v=(location.hash||"").slice(1);if(!["teacher","student","library"].includes(v)){try{v=localStorage.getItem("ll-view")||"teacher"}catch(e){v="teacher"}}if(!["teacher","student","library"].includes(v))v="teacher";S.view=v;render();initDb()})();
</script>
